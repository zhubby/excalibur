apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}/api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: API_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            - name: STORAGE_BACKEND
              value: {{ .Values.env.STORAGE_BACKEND | quote }}
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: NATS_URL
              value: {{ .Values.env.NATS_URL | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.env.S3_ENDPOINT | quote }}
            - name: S3_PUBLIC_ENDPOINT
              value: {{ .Values.env.S3_PUBLIC_ENDPOINT | quote }}
            - name: S3_BUCKET
              value: {{ .Values.env.S3_BUCKET | quote }}
            - name: S3_REGION
              value: {{ .Values.env.S3_REGION | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ .Values.env.S3_ACCESS_KEY_ID | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ .Values.env.S3_SECRET_ACCESS_KEY | quote }}
            - name: API_AUTH_RATE_LIMIT_MAX_ATTEMPTS
              value: {{ .Values.env.API_AUTH_RATE_LIMIT_MAX_ATTEMPTS | quote }}
            - name: API_AUTH_RATE_LIMIT_WINDOW_SECONDS
              value: {{ .Values.env.API_AUTH_RATE_LIMIT_WINDOW_SECONDS | quote }}
            - name: EXCALIBUR_ALLOW_DEV_CA
              value: {{ .Values.env.EXCALIBUR_ALLOW_DEV_CA | quote }}
            - name: EXCALIBUR_ENABLE_DEV_AUTH
              value: {{ .Values.env.EXCALIBUR_ENABLE_DEV_AUTH | quote }}
{{- if .Values.api.caPrivateKeySecret.name }}
            - name: EXCALIBUR_CA_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.caPrivateKeySecret.name | quote }}
                  key: {{ .Values.api.caPrivateKeySecret.key | quote }}
{{- end }}
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.env.SESSION_COOKIE_SECURE | quote }}
            - name: DEVICE_MQTT_BROKER
              value: {{ .Values.env.DEVICE_MQTT_BROKER | quote }}
            - name: DEVICE_MQTT_PORT
              value: {{ .Values.env.DEVICE_MQTT_PORT | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.api.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
          resources:
{{ toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
