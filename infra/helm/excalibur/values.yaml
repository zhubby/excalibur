image:
  repository: excalibur
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8080
  caPrivateKeySecret:
    name: ""
    key: ca-private-key.pem
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mqttIngest:
  replicas: 2
  port: 1883
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicas: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migrations:
  enabled: true
  image: postgres:16-alpine
  backoffLimit: 3
  activeDeadlineSeconds: 600

env:
  STORAGE_BACKEND: timescale
  DATABASE_URL: postgres://excalibur:excalibur@timescaledb:5432/excalibur
  NATS_URL: nats://nats:4222
  S3_ENDPOINT: http://rustfs:9000
  S3_PUBLIC_ENDPOINT: https://objects.example.com
  S3_BUCKET: excalibur
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: excalibur
  S3_SECRET_ACCESS_KEY: change-me
  API_AUTH_RATE_LIMIT_MAX_ATTEMPTS: "20"
  API_AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
  EXCALIBUR_ALLOW_DEV_CA: "false"
  EXCALIBUR_ENABLE_DEV_AUTH: "false"
  SESSION_COOKIE_SECURE: "true"
  DEVICE_MQTT_BROKER: mqtt.local.excalibur.dev
  DEVICE_MQTT_PORT: "1883"
  MQTT_TELEMETRY_BUFFER: nats
  MQTT_TELEMETRY_NATS_SUBJECT: excalibur.telemetry.ingest
  MQTT_TELEMETRY_NATS_STREAM: EXCALIBUR_TELEMETRY
  MQTT_COMMAND_BRIDGE: nats
  MQTT_COMMAND_NATS_SUBJECT: excalibur.commands.dispatch
  MQTT_REQUIRE_CERT_FINGERPRINT_USERNAME: "false"
  MQTT_TLS_CA_CERT_PATH: ""
  MQTT_TLS_SERVER_CERT_PATH: ""
  MQTT_TLS_SERVER_KEY_PATH: ""
  WORKER_TELEMETRY_NATS_SUBJECT: excalibur.telemetry.ingest
  WORKER_TELEMETRY_NATS_STREAM: EXCALIBUR_TELEMETRY
  WORKER_TELEMETRY_DELIVERY_SUBJECT: excalibur.telemetry.deliver
  WORKER_TELEMETRY_DEAD_LETTER_SUBJECT: excalibur.telemetry.dead_letter
  WORKER_TELEMETRY_QUEUE_GROUP: excalibur-telemetry-workers
  WORKER_TELEMETRY_BATCH_SIZE: "256"
  WORKER_TELEMETRY_BATCH_WINDOW_MS: "1000"
  WORKER_ACTION_COMMAND_SUBJECT: excalibur.commands.dispatch
  WORKER_ACTION_CLAIM_LIMIT: "100"
  WORKER_ACTION_DISPATCH_INTERVAL_MS: "1000"
  WORKER_ACTION_TIMEOUT_SECONDS: "900"
  WORKER_ACTION_TIMEOUT_SCAN_LIMIT: "100"
  WORKER_ALERT_SCAN_INTERVAL_MS: "30000"
  WORKER_ALERT_DEFAULT_OFFLINE_AFTER_SECONDS: "300"
  WORKER_ALERT_DEFAULT_WINDOW_SECONDS: "300"
  WORKER_ALERT_NOTIFICATION_SUBJECT: excalibur.alerts.notifications
