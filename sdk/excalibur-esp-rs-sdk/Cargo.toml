[package]
name = "excalibur-esp-rs"
version = "0.1.0"
edition = "2021"
description = "SDK for connecting ESP boards with Excalibur"
authors = ["Excalibur contributors"]
repository = "https://github.com/excalibur/excalibur"
keywords = ["embedded", "esp-idf", "esp32", "excalibur", "iot"]
categories = ["embedded"]
license = "MIT"

[features]
default = ["esp-idf"]
esp-idf = [
    "dep:embedded-svc",
    "dep:esp-idf-hal",
    "dep:esp-idf-svc",
    "dep:esp-idf-sys",
]

[dependencies]
embedded-svc = { version = "0.24.0", optional = true }
esp-idf-svc = { version = "0.45.0", optional = true }
esp-idf-sys = { version = "0.32.1", optional = true }
static_cell = "1.0.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
esp-idf-hal = { version = "0.40.1", optional = true }
anyhow = "1.0.68"
log = "0.4.17"

[build-dependencies]
embuild = "0.31"

[dev-dependencies]
tempfile = "3"
toml-cfg = "0.1.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
