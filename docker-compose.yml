services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: excalibur
      POSTGRES_USER: excalibur
      POSTGRES_PASSWORD: excalibur
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excalibur -d excalibur"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: excalibur
      RUSTFS_SECRET_KEY: excalibur-secret
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BIN: excalibur-api
    environment:
      API_ADDR: 0.0.0.0:8080
      STORAGE_BACKEND: timescale
      DATABASE_URL: postgres://excalibur:excalibur@timescaledb:5432/excalibur
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://rustfs:9000
      DEVICE_MQTT_BROKER: localhost
      DEVICE_MQTT_PORT: "1883"
    ports:
      - "8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started
      rustfs:
        condition: service_healthy

  mqtt-ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BIN: excalibur-mqtt-ingest
    environment:
      MQTT_LISTEN: 0.0.0.0:1883
      STORAGE_BACKEND: timescale
      DATABASE_URL: postgres://excalibur:excalibur@timescaledb:5432/excalibur
      NATS_URL: nats://nats:4222
    ports:
      - "1883:1883"
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BIN: excalibur-worker
    environment:
      DATABASE_URL: postgres://excalibur:excalibur@timescaledb:5432/excalibur
      NATS_URL: nats://nats:4222
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  timescaledb-data:
  nats-data:
  rustfs-data:
