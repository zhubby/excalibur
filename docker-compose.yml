services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: excalibur
      POSTGRES_USER: excalibur
      POSTGRES_PASSWORD: excalibur
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excalibur -d excalibur"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: excalibur
      RUSTFS_SECRET_KEY: excalibur-secret
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BIN: excalibur-api
    environment:
      API_ADDR: 0.0.0.0:8080
      STORAGE_BACKEND: timescale
      DATABASE_URL: postgres://excalibur:excalibur@timescaledb:5432/excalibur
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: excalibur
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: excalibur
      S3_SECRET_ACCESS_KEY: excalibur-secret
      API_AUTH_RATE_LIMIT_MAX_ATTEMPTS: "20"
      API_AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
      EXCALIBUR_ALLOW_DEV_CA: "true"
      EXCALIBUR_ENABLE_DEV_AUTH: "true"
      DEVICE_MQTT_BROKER: localhost
      DEVICE_MQTT_PORT: "1883"
    ports:
      - "8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started
      rustfs:
        condition: service_healthy

  mqtt-ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BIN: excalibur-mqtt-ingest
    environment:
      MQTT_LISTEN: 0.0.0.0:1883
      STORAGE_BACKEND: timescale
      DATABASE_URL: postgres://excalibur:excalibur@timescaledb:5432/excalibur
      NATS_URL: nats://nats:4222
      MQTT_TELEMETRY_BUFFER: nats
      MQTT_TELEMETRY_NATS_SUBJECT: excalibur.telemetry.ingest
      MQTT_TELEMETRY_NATS_STREAM: EXCALIBUR_TELEMETRY
      MQTT_COMMAND_BRIDGE: nats
      MQTT_COMMAND_NATS_SUBJECT: excalibur.commands.dispatch
      MQTT_REQUIRE_CERT_FINGERPRINT_USERNAME: "true"
      MQTT_ALLOW_PLAINTEXT_FINGERPRINT_AUTH: "true"
    ports:
      - "1883:1883"
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BIN: excalibur-worker
    environment:
      STORAGE_BACKEND: timescale
      DATABASE_URL: postgres://excalibur:excalibur@timescaledb:5432/excalibur
      NATS_URL: nats://nats:4222
      WORKER_TELEMETRY_NATS_SUBJECT: excalibur.telemetry.ingest
      WORKER_TELEMETRY_NATS_STREAM: EXCALIBUR_TELEMETRY
      WORKER_TELEMETRY_DELIVERY_SUBJECT: excalibur.telemetry.deliver
      WORKER_TELEMETRY_DEAD_LETTER_SUBJECT: excalibur.telemetry.dead_letter
      WORKER_TELEMETRY_QUEUE_GROUP: excalibur-telemetry-workers
      WORKER_TELEMETRY_BATCH_SIZE: "256"
      WORKER_TELEMETRY_BATCH_WINDOW_MS: "1000"
      WORKER_ACTION_COMMAND_SUBJECT: excalibur.commands.dispatch
      WORKER_ACTION_CLAIM_LIMIT: "100"
      WORKER_ACTION_DISPATCH_INTERVAL_MS: "1000"
      WORKER_ACTION_TIMEOUT_SECONDS: "900"
      WORKER_ACTION_TIMEOUT_SCAN_LIMIT: "100"
      WORKER_ALERT_SCAN_INTERVAL_MS: "30000"
      WORKER_ALERT_DEFAULT_OFFLINE_AFTER_SECONDS: "300"
      WORKER_ALERT_DEFAULT_WINDOW_SECONDS: "300"
      WORKER_ALERT_NOTIFICATION_SUBJECT: excalibur.alerts.notifications
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  timescaledb-data:
  nats-data:
  rustfs-data:
