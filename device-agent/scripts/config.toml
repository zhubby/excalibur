persistence_path = "/tmp/device_agent"
action_redirections={"ota.install"="install_firmware"}
[tcpapps.1]
port=5050
actions=[{name="reboot"}]

[downloader]
path="/tmp/device_agent/download"
actions=[{name="ota.install", timeout=610}, {name="send_file"}]

[apis]
enabled=true
port=3333

[ota_installer]
path="/tmp/device_agent/installer"
actions=[{name="install_firmware", timeout=610}]
device_agent_port=5050

[logging]
tags=["sshd", "systemd"]
stream_size=1
min_level=7
